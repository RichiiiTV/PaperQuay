name: Windows build and checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch OCR models
        run: ./scripts/Get-OcrModels.ps1
      - name: Install test fixture dependencies
        run: python -m pip install -r tests/PaperQuay.Checks/requirements.txt
      - name: Build and run checks
        run: ./scripts/Test.ps1 -IncludeQueue
